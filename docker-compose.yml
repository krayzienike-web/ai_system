services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    environment:
      FAI_ENV: dev
      FAI_DATABASE_URL: postgresql+psycopg://franchise_app:app@db:5432/franchise
      FAI_MIGRATIONS_DATABASE_URL: postgresql+psycopg://franchise_owner:owner@db:5432/franchise
      FAI_REDIS_URL: redis://redis:6379
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend/app:/app/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  # Background work: the findings are recomputed here after every upload (app/analytics/runs.py).
  worker:
    build: ./backend
    environment:
      FAI_ENV: dev
      FAI_DATABASE_URL: postgresql+psycopg://franchise_app:app@db:5432/franchise
      FAI_REDIS_URL: redis://redis:6379
    command: arq app.worker.WorkerSettings
    volumes: ["./backend/app:/app/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  frontend:
    image: node:22
    working_dir: /app
    environment:
      API_URL: http://backend:8000
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  frontend_node_modules:
