.between{justify-content:space-between}

tr:last-child td{border-bottom:0}
.gate td{background:var(--brand-soft)}

.dish{min-width:170px;padding:10px 12px !important}

.ev:last-child{border-bottom:0}
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,25,.35);z-index:20}

  .ev{grid-template-columns:1fr;gap:4px}
  h1{font-size:22px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const stageStatus = (run,s) => {
  if(s.doneAt) return s.doneAt>s.due?{t:`Сдано ${fmt(s.doneAt)}, позже на ${days(diff(s.doneAt,s.due))}`,c:"p-warn",k:"late-done"}:{t:`Сдано ${fmt(s.doneAt)}`,c:"p-ok",k:"done"};
  if(run.done) return {t:"Закрыто",c:"p-ok",k:"done"};
  if(s.due<TODAY) return {t:`Просрочено на ${days(diff(TODAY,s.due))}`,c:"p-bad",k:"overdue"};
  const ready = s.deps.every(n=>{const x=run.stages.find(y=>y.n===n);return !x||x.doneAt;});
  return ready?{t:`В работе, осталось ${days(diff(s.due,TODAY))}`,c:"p-info",k:"active"}:{t:"Ждет предыдущих этапов",c:"p-mute",k:"wait"};
};
const gateDone = (run,n) => { const g=run.stages.find(s=>s.n===n); return !!(g&&g.doneAt); };
const frozen = (run,col) => COL[col].gate && gateDone(run,COL[col].gate);
const gateName = (run,n) => (run.stages.find(s=>s.n===n)||{}).t;
const cellState = c => !c ? "na" : (c.state || (c.v===""?"empty":"ok"));
function showcaseIssues(run, sc){
  const out=[];
  run.rows.filter(r=>r.change!=="remove").forEach(r=>{
    sc.req.forEach(k=>{const c=r.cells[k];const st=cellState(c);
      if(st==="empty") out.push(`${r.dish}: не заполнено «${COL[k].t}»`);
      else if(st==="error") out.push(`${r.dish}: ошибка в «${COL[k].t}»`);
      else if(st==="review") out.push(`${r.dish}: «${COL[k].t}» требует проверки`);});
    if(sc.limit && r.cells.guest && r.cells.guest.v.length>sc.limit) out.push(`${r.dish}: название ${r.cells.guest.v.length} знаков, лимит витрины ${sc.limit}`);
  });
  return out;
}
function runCounts(run){
  let empty=0,review=0,error=0;
  run.rows.forEach(r=>Object.values(r.cells).forEach(c=>{const s=cellState(c);if(s==="empty")empty++;if(s==="review")review++;if(s==="error")error++;}));
  const overdue=run.stages.filter(s=>stageStatus(run,s).k==="overdue").length;
  const done=run.stages.filter(s=>s.doneAt).length;
  return {empty,review,error,overdue,done,total:run.stages.length,reqs:run.requests.filter(x=>x.status==="new").length,reps:run.reports.filter(x=>x.status==="new").length};
}

    <div class="tabs" role="tablist">${tabs.map(([k,t,n])=>`<button class="tab ${S.tab===k?"on":""}" data-tab="${k}" role="tab">${t}${n?`<em>${n}</em>`:""}</button>`).join("")}</div>

  const cnt=k=>r.events.filter(e=>e.kind===k).length;
  const pend=r.reports.filter(x=>x.status==="new");
  return `<div class="note">Видят только владелец процесса и УК. Каждое событие посчитано по журналу правок и срокам. Ошибку по сообщению участника фиксирует только владелец процесса после проверки.</div>
  ${r.done?`<div class="card"><h2>Отчет после запуска</h2><div class="kpis" style="margin-top:12px">
    <div class="kpi"><b>${r.report.shift}</b><span>дня сдвиг старта</span></div><div class="kpi"><b>${r.report.lateEdits}</b><span>правок после ворот</span></div>
    <div class="kpi"><b>${r.report.lateTasks}</b><span>сорванных сроков</span></div><div class="kpi"><b>${r.report.errors}</b><span>ошибок в данных</span></div>
    <div class="kpi"><b>${r.report.reprint}</b><span>перепечатка меню</span></div><div class="kpi"><b>${r.report.reloads}</b><span>повторных загрузки в витрины</span></div></div></div>`:""}
  ${pend.length?`<div class="card"><h2>Сообщения об ошибках ждут проверки</h2>${pend.map(p=>{const row=r.rows.find(x=>x.id===p.row);const cl=row.cells[p.col];const last=cl.hist[cl.hist.length-1];
    return `<div class="ev"><div class="small muted">${fmt(p.at)} · от ${P[p.by].name}</div><div><b>${esc(row.dish)} · ${COL[p.col].t}</b><div class="small">${esc(p.text)}</div>
    <div class="muted small">Последним правил: ${last?P[last.by].name+", "+fmt(last.at):"—"}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm pri" data-confirm="${p.id}">Подтвердить ошибку</button><button class="btn sm" data-dismiss="${p.id}">Ошибки нет</button></div></div></div>`;}).join("")}</div>`:""}
  <div class="kpis">${Object.entries(KIND).map(([k,v])=>`<button class="kpi" data-filter="${k}" style="text-align:left;border:${S.filter===k?"2px solid var(--brand)":"1px solid transparent"};cursor:pointer"><b>${cnt(k)}</b><span>${v.t}</span></button>`).join("")}</div>
  <div class="scroll"><table><thead><tr><th>Кто</th>${Object.values(KIND).map(v=>`<th>${v.t}</th>`).join("")}<th>Всего</th></tr></thead><tbody>
  ${Object.entries(people).sort((a,b)=>Object.values(b[1]).reduce((x,y)=>x+y)-Object.values(a[1]).reduce((x,y)=>x+y)).map(([w,c])=>`<tr><td>${P[w].name}<div class="muted small">${P[w].role}</div></td>${Object.keys(KIND).map(k=>`<td>${c[k]||"—"}</td>`).join("")}<td><b>${Object.values(c).reduce((x,y)=>x+y)}</b></td></tr>`).join("")}
  </tbody></table></div>
  <div class="card"><div class="row between"><h2>События</h2>${S.filter!=="all"?`<button class="btn sm" data-filter="all">Показать все</button>`:""}</div>
  ${evs.length?evs.map(e=>`<div class="ev"><div class="small"><span class="pill ${KIND[e.kind].cls}">${KIND[e.kind].t}</span><div class="muted" style="margin-top:6px">${fmtY(e.at)}</div></div>
    <div><b>${P[e.who].name}</b> <span class="muted small">${P[e.who].role}</span><div class="small">${esc(e.text)}</div></div></div>`).join(""):`<div class="muted small" style="margin-top:8px">Событий этого вида нет.</div>`}</div>`;
}

// ---------- drawers
function openDrawer(html){ layer.innerHTML=`<div class="drawer-bg" data-close></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;
  layer.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeDrawer); bindDrawer(); }
function closeDrawer(){ layer.innerHTML=""; }
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
let drawerCtx=null;
function cellDrawer(r,rowId,k){
  const row=r.rows.find(x=>x.id===rowId), cl=row.cells[k], col=COL[k], st=cellState(cl);
  const mine=col.fn===myFn(), fr=frozen(r,k);
  drawerCtx={r,row,k};
  const stTxt={ok:`<span class="pill p-ok">Заполнено</span>`,empty:`<span class="pill p-bad">Не заполнено</span>`,review:`<span class="pill p-warn">Требует проверки</span>`,error:`<span class="pill p-bad">Ошибка</span>`}[st];
  let act="";
  if(r.done) act="";
  else if(mine&&!fr) act=`<div class="field"><label for="nv">Новое значение</label><input id="nv" value="${esc(cl.v)}"></div>
    <div class="row"><button class="btn pri" data-d="save">Сохранить</button>${st==="review"?`<button class="btn" data-d="ok">Проверено, менять не нужно</button>`:""}</div>
    ${(DEPS[k]||[]).length?`<div class="muted small">После правки поля ${DEPS[k].map(x=>"«"+COL[x].t+"»").join(", ")} получат метку «Требует проверки», владельцам придет уведомление.</div>`:""}`;
  else if(mine&&fr) act=`<div class="note">Поле заморожено воротами «${esc(gateName(r,col.gate))}». Изменить можно через запрос — его утверждает владелец процесса.</div>
    <div class="field"><label for="nv">Новое значение</label><input id="nv" value="${esc(cl.v)}"></div>
    <div class="field"><label for="why">Почему меняем</label><textarea id="why" rows="2"></textarea></div>
    <button class="btn pri" data-d="request">Отправить запрос на изменение</button>`;
  else act=`<div class="muted small">Поле заполняет ${FN_NAME[col.fn]} — ${P[BY_FN[col.fn]].name}. Если видите ошибку, сообщите: владелец процесса проверит и вернет поле на исправление.</div>
    <div class="field"><label for="why">Что не так</label><textarea id="why" rows="2"></textarea></div>
    <button class="btn" data-d="report">Сообщить об ошибке</button>`;
  openDrawer(`<div class="row between"><div><div class="muted small">${esc(row.dish)}</div><h2>${col.t}</h2></div><button class="btn sm" data-close>Закрыть</button></div>
    <div class="row">${stTxt}${fr?`<span class="pill p-info">Заморожено воротами</span>`:""}<span class="muted small">Заполняет: ${FN_NAME[col.fn]}</span></div>
    <div style="font-size:16px">${st==="empty"?`<span class="muted">Пусто</span>`:esc(cl.v)}</div>
    ${cl.note?`<div class="note">${esc(cl.note)}</div>`:""}
    ${act}
    <h3>История правок</h3>
    ${cl.hist.length?`<div class="hist">${[...cl.hist].reverse().map(h=>`<div><b>${fmtY(h.at)}</b> · ${P[h.by].name}${h.afterGate?` · <span style="color:var(--info)">после ворот «${esc(h.afterGate)}»${h.req?", по запросу":""}</span>`:""}<br>${h.from?`<span class="muted">${esc(h.from)}</span> → `:""}${esc(h.to)}</div>`).join("")}</div>`:`<div class="muted small">Поле еще не заполняли.</div>`}`);
}
function markDeps(r,row,k,cause){
  const flagged=[];
  (DEPS[k]||[]).forEach(x=>{const c=row.cells[x]; if(c&&c.v!==""){c.state="review";c.note=`${cause}. Поле нужно проверить до ${fmt(addDays(TODAY,2))}`;c.flagDue=addDays(TODAY,2);flagged.push(COL[x].t);}});
  return flagged;
}
function bindDrawer(){
  layer.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
    const {r,row,k}=drawerCtx, cl=row.cells[k], act=b.dataset.d, nv=(layer.querySelector("#nv")||{}).value, why=((layer.querySelector("#why")||{}).value||"").trim();
    if(act==="save"){ if(nv===cl.v){toast("Значение не изменилось");return;}
      cl.hist.push({at:TODAY,by:S.viewer,from:cl.v,to:nv}); cl.v=nv; delete cl.state; delete cl.note;
      const f=markDeps(r,row,k,`${COL[k].t} изменено ${fmt(TODAY)}`); closeDrawer(); render();
      toast(f.length?`Сохранено. Требует проверки: ${f.join(", ")} — владельцам ушло уведомление`:"Сохранено. Правка записана в историю"); }
    if(act==="ok"){ cl.hist.push({at:TODAY,by:S.viewer,from:cl.v,to:cl.v+" (проверено)"}); delete cl.state; delete cl.note; closeDrawer(); render(); toast("Отмечено: поле проверено"); }
    if(act==="request"){ if(!why){toast("Напишите, почему меняем");return;}
      r.requests.unshift({id:"cr"+Date.now(),row:row.id,col:k,from:cl.v,to:nv,by:S.viewer,at:TODAY,reason:why,status:"new"}); closeDrawer(); S.tab="reqs"; render(); toast("Запрос отправлен владельцу процесса"); }
    if(act==="report"){ if(!why){toast("Опишите, что не так");return;}
      r.reports.unshift({id:"er"+Date.now(),row:row.id,col:k,by:S.viewer,at:TODAY,text:why,status:"new"}); closeDrawer(); render(); toast("Сообщение отправлено владельцу процесса"); }
  });
}
function dueDrawer(r,n){
  const s=r.stages.find(x=>x.n===n);
  openDrawer(`<div class="row between"><div><div class="muted small">Изменить срок</div><h2>${esc(s.t)}</h2></div><button class="btn sm" data-close>Закрыть</button></div>
    <div class="muted small">Сейчас: ${fmtY(s.due)}, по шаблону ${days(-s.off)} до старта.</div>
    <div class="field"><label for="nd">Новый срок</label><input type="date" id="nd" value="${s.due}"></div>
    <div class="field"><label for="why">Причина</label><textarea id="why" rows="2"></textarea></div>
    <button class="btn pri" id="saveDue">Сохранить срок</button>`);
  layer.querySelector("#saveDue").onclick=()=>{const nd=layer.querySelector("#nd").value, why=layer.querySelector("#why").value.trim();
    if(!why){toast("Укажите причину: она попадет в историю");return;}
    s.dueEdits.push({at:TODAY,by:S.viewer,from:s.due,to:nd,reason:why}); s.due=nd; closeDrawer(); render(); toast(`Срок изменен. ${P[s.who].name} получит уведомление`);};
}
function launchDrawer(){
  let kind="global", launch="2027-03-01", brand="Пиццерия «Тесто»", title="Весеннее меню 2027";
  const draw=()=>{const st=makeStages(kind,launch);
    openDrawer(`<div class="row between"><h2>Запустить ввод меню</h2><button class="btn sm" data-close>Закрыть</button></div>
    <div class="field"><label for="lb">Бренд</label><select id="lb">${["Пиццерия «Тесто»","Паста-бар «Альденте»"].map(b=>`<option ${b===brand?"selected":""}>${b}</option>`).join("")}</select></div>
    <div class="field"><label for="lt">Название</label><input id="lt" value="${esc(title)}"></div>
    <div class="field"><label for="lk">Тип</label><select id="lk"><option value="global" ${kind==="global"?"selected":""}>Глобальный: новое меню целиком</option><option value="partial" ${kind==="partial"?"selected":""}>Точечный: одно или несколько блюд</option></select></div>
    <div class="field"><label for="ld">Старт продаж</label><input type="date" id="ld" value="${launch}"></div>
    <h3>Этапы и сроки</h3><div class="muted small">Посчитаны от даты старта. Срок и исполнителя можно поправить.</div>
    <div class="scroll"><table><tbody>${st.map(s=>`<tr class="${s.gate?"gate":""}"><td>${s.gate?"<b>Ворота: </b>":""}${esc(s.t)}<div class="muted small">${P[s.who].name}</div></td><td><input class="date-in" type="date" data-ldue="${s.n}" value="${s.due}" aria-label="Срок: ${esc(s.t)}"></td></tr>`).join("")}</tbody></table></div>
    ${st[0].due<TODAY?`<div class="note" style="color:var(--bad)">Первый срок уже прошел: ${fmtY(st[0].due)}. Сдвиньте старт или сроки.</div>`:""}
    <button class="btn pri" id="go">Запустить и поставить задачи</button>`);
    layer.querySelector("#lk").onchange=e=>{kind=e.target.value;title=layer.querySelector("#lt").value;draw();};
    layer.querySelector("#ld").onchange=e=>{launch=e.target.value;title=layer.querySelector("#lt").value;draw();};
    layer.querySelector("#lb").onchange=e=>{brand=e.target.value;};
    layer.querySelector("#go").onclick=()=>{const stages=makeStages(kind,launch);
      layer.querySelectorAll("[data-ldue]").forEach(i=>{const s=stages.find(x=>x.n===+i.dataset.ldue);if(i.value!==s.due){s.dueEdits.push({at:TODAY,by:S.viewer,from:s.due,to:i.value,reason:"Поправлено при запуске"});s.due=i.value;}});
      const id="r"+Date.now(); S.runs.unshift({id,brand,title:layer.querySelector("#lt").value||title,kind,launch,startedAt:TODAY,stages,rows:[],requests:[],reports:[],events:[],exports:[]});
      const n=new Set(stages.map(s=>s.who)).size; closeDrawer(); S.view="run"; S.runId=id; S.tab="stages"; render(); toast(`Процесс запущен: ${stages.length} задач, ${n} ${plural(n,"исполнитель","исполнителя","исполнителей")} получили уведомления`);};
  };
  draw();
}

// ---------- actions
function bind(){
  app.querySelectorAll("[data-open]").forEach(el=>{const go=()=>{S.view="run";S.runId=el.dataset.open;S.tab="stages";S.filter="all";render();window.scrollTo(0,0);};el.onclick=go;el.onkeydown=e=>{if(e.key==="Enter")go();};});
  app.querySelectorAll("[data-act=back]").forEach(b=>b.onclick=()=>{S.view="list";render();});
  app.querySelectorAll("[data-act=launch]").forEach(b=>b.onclick=launchDrawer);
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  const r=S.runs.find(x=>x.id===S.runId);
  app.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>{const [row,k]=b.dataset.cell.split(":");cellDrawer(r,row,k);});
  app.querySelectorAll("[data-due]").forEach(b=>b.onclick=()=>dueDrawer(r,+b.dataset.due));
  app.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter===S.filter?"all":b.dataset.filter;render();});
  app.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{const q=r.requests.find(x=>x.id===b.dataset.approve), row=r.rows.find(x=>x.id===q.row), cl=row.cells[q.col];
    const g=gateName(r,COL[q.col].gate);
    cl.hist.push({at:TODAY,by:q.by,from:cl.v,to:q.to,afterGate:g,req:true}); cl.v=q.to; q.status="approved"; q.decidedAt=TODAY;
    const f=markDeps(r,row,q.col,`${COL[q.col].t} изменено ${fmt(TODAY)} по запросу`);
    const gs=r.stages.find(s=>s.n===COL[q.col].gate);
    r.events.unshift({kind:"lateedit",who:q.by,at:TODAY,stage:gs.n,text:`«${row.dish}», ${COL[q.col].t.toLowerCase()}: ${q.from} → ${q.to}. Через ${days(diff(TODAY,gs.doneAt))} после ворот «${g}», за ${days(diff(r.launch,TODAY))} до старта. Запрос утвердил ${P[S.viewer].name}. Затронуто: ${f.join(", ")||"выгрузки"}`});
    render(); toast(`Утверждено. Требует проверки: ${f.join(", ")}. Уведомлены: ${[...new Set((DEPS[q.col]||[]).map(x=>P[BY_FN[COL[x].fn]].name))].join(", ")}`);});
  app.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>{const q=r.requests.find(x=>x.id===b.dataset.reject);q.status="rejected";render();toast(`Запрос отклонен, ${P[q.by].name} получит уведомление`);});
  app.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>{const p=r.reports.find(x=>x.id===b.dataset.confirm),row=r.rows.find(x=>x.id===p.row),cl=row.cells[p.col],last=cl.hist[cl.hist.length-1];
    p.status="confirmed"; cl.state="error"; cl.note=`Подтвержденная ошибка: ${p.text}`;
    r.events.unshift({kind:"error",who:last.by,at:TODAY,stage:null,text:`«${row.dish}», ${COL[p.col].t}: ${p.text}. Значение внесено ${fmt(last.at)}. Сообщил ${P[p.by].name}, подтвердил ${P[S.viewer].name}`});
    render(); toast(`Ошибка зафиксирована. ${P[last.by].name} получит задачу исправить поле`);});
  app.querySelectorAll("[data-dismiss]").forEach(b=>b.onclick=()=>{const p=r.reports.find(x=>x.id===b.dataset.dismiss),row=r.rows.find(x=>x.id===p.row),cl=row.cells[p.col];
    p.status="dismissed"; if(cl.state==="error"){delete cl.state;delete cl.note;} render(); toast("Сообщение закрыто: ошибки нет");});
  app.querySelectorAll("[data-export]").forEach(b=>b.onclick=()=>{const sc=SHOWCASES.find(x=>x.k===b.dataset.export);const ver=14+r.exports.length;
    r.exports=r.exports.filter(e=>e.sc!==sc.k);r.exports.push({sc:sc.k,at:TODAY,ver});render();toast(`Файл для «${sc.t}» готов, версия карточки ${ver}. В прототипе файл не создается`);});
}
let tt; function toast(m){ clearTimeout(tt); let t=document.querySelector(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);} t.textContent=m; tt=setTimeout(()=>t.remove(),4200); }
render();
</script>
