# The demo stand (docs/06, stage 5): the production build on one server, HTTPS by Caddy.
# Usage — deploy/README.md. Secrets come from deploy/.env (copy .env.example), never from this file.
name: souschef

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?set in deploy/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init-prod.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped

  # Migrations once per deploy, as the schema owner; the API and the worker start after it.
  migrate:
    build: ../backend
    environment: &backend-env
      FAI_ENV: prod
      FAI_JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      FAI_DATABASE_URL: postgresql+psycopg://franchise_app:${APP_DB_PASSWORD}@db:5432/franchise
      FAI_MIGRATIONS_DATABASE_URL: postgresql+psycopg://franchise_owner:${OWNER_DB_PASSWORD}@db:5432/franchise
      FAI_REDIS_URL: redis://redis:6379
      FAI_CORS_ORIGINS: '["https://${DOMAIN}"]'
      FAI_DEMO_TODAY: ${DEMO_TODAY:-2026-10-20}
      FAI_DEMO_RESET_NIGHTLY: "true"
      FAI_DEMO_PASSWORD: ${DEMO_PASSWORD:?set in deploy/.env}
      FAI_AI_PROVIDER: ${AI_PROVIDER:-off}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: alembic upgrade head
    depends_on:
      db: { condition: service_healthy }

  backend:
    build: ../backend
    restart: unless-stopped
    environment: *backend-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  # Recalculation after uploads and the nightly rebuild of the demo network.
  worker:
    build: ../backend
    restart: unless-stopped
    environment: *backend-env
    command: arq app.worker.WorkerSettings
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  web:
    build: ../frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set in deploy/.env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
