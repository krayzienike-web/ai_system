[project]
name = "franchise-ai-backend"
version = "0.1.0"
description = "AI center for restaurant franchise management — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pyjwt",
    "argon2-cffi",
    "polars>=2.0.0",
    "fastexcel>=0.21.0",
    "python-multipart>=0.0.32",
    "xlsxwriter>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tests/conftest.py" = ["S105", "E402"]
"app/cli.py" = ["S105", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py"]

[tool.coverage.report]
skip_empty = true
fail_under = 90
show_missing = false
