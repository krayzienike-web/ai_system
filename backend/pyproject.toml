[project]
name = "franchise-ai-backend"
version = "0.1.0"
description = "AI center for restaurant franchise management — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "pyjwt",
    "argon2-cffi",
    "polars>=2.0.0",
    "fastexcel>=0.21.0",
    "python-multipart>=0.0.32",
    "xlsxwriter>=3.3.0",
    "arq>=0.28.0",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
    "import-linter>=2.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tests/conftest.py" = ["S105", "E402"]
"app/cli.py" = ["S105", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/cli.py"]

[tool.coverage.report]
skip_empty = true
fail_under = 90
show_missing = false

# Module boundaries (docs/03-architecture.md; CLAUDE.md: modules talk through services, `analytics` does not import `ai`).
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the AI gateway talks to the model"
type = "forbidden"
source_modules = [
    "app.analytics", "app.auth", "app.catalog", "app.chat", "app.core", "app.experiments", "app.imports",
    "app.insights", "app.norms", "app.operations", "app.overview", "app.reports", "app.tasks", "app.tenancy",
]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
name = "Numbers do not depend on the assistant: domain modules import neither ai nor the chat"
type = "forbidden"
source_modules = [
    "app.analytics", "app.auth", "app.catalog", "app.core", "app.experiments", "app.imports", "app.insights",
    "app.norms", "app.operations", "app.overview", "app.reports", "app.tasks", "app.tenancy",
]
forbidden_modules = ["app.ai", "app.chat"]

[[tool.importlinter.contracts]]
name = "The demo is outside the product: only the CLI loads it"
type = "forbidden"
source_modules = [
    "app.ai", "app.analytics", "app.auth", "app.catalog", "app.chat", "app.core", "app.experiments", "app.imports",
    "app.insights", "app.main", "app.norms", "app.operations", "app.overview", "app.reports", "app.tasks",
    "app.tenancy", "app.worker",
]
forbidden_modules = ["app.demo"]

[[tool.importlinter.contracts]]
name = "The kernel knows no domain: core and tenancy import nothing above them"
type = "forbidden"
source_modules = ["app.core", "app.tenancy"]
forbidden_modules = [
    "app.ai", "app.analytics", "app.auth", "app.catalog", "app.chat", "app.experiments", "app.imports", "app.insights",
    "app.norms", "app.operations", "app.overview", "app.reports", "app.tasks",
]
